<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <!-- Kein maximum-scale und kein user-scalable=no: das Aufziehen mit zwei
       Fingern zu sperren schließt Menschen aus, die es brauchen (WCAG 1.4.4).
       Damit iOS beim Fokus in ein Feld nicht selbst hineinzoomt, sind die
       Eingabefelder auf schmalen Schirmen 16px groß — siehe style.css. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7c4dff" />
  <!-- Ohne Referer blockt OpenStreetMap die Kartentiles. Die Policy steht
       zusätzlich im Dokument, weil der Service Worker die Shell cacht und
       eine gecachte Antwort sonst die alte Kopfzeile mitschleppen würde. -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description" content="Wegzeichen – Notizen, Wanderwege, Orte und Reisen" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wegzeichen" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <title>Wegzeichen</title>
</head>
<body>
  <div id="app"></div>
  <div class="toast-container" id="toasts"></div>
  <script src="/vendor/leaflet/leaflet.js" defer></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
